name: 大麦去广告
description: 移除开屏广告、轮播图广告和弹窗广告，移除搜索填充词和专属推荐。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Damai.png
open_url: https://apps.apple.com/app/id513829338
tag: 去广告
url_rewrites:
- match: (?i)^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.home\.welcome\/
  location: http://reject-dict/
- match: (?i)^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.mec\.popup\.get\/
  location: http://reject-dict/
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.user\.my\.content\.get\/
    filter: del(.data.banner, .data.performFilmVip.userProfitList)
- response_jq:
    match: (?i)^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.mypage\.feed\/
    filter: del(.data.feedCard)
- response_jq:
    match: (?i)^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.mec\.aristotle\.get\/
    filter: del(.data.data.top.keywords)
mitm:
  hostnames:
  - acs.m.taobao.com
