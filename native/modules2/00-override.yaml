name: Egern 优先级补丁
description: 修正被其他模块误拦的域名。必须放在模块列表最上面才生效。
author: egern-mirror / curated
homepage: https://github.com/tuohai57/egern-mirror/tree/main/curated
rules:
- domain:
    match: httpdns.volcengineapi.com
    policy: DIRECT
    name: 字节 HTTPDNS 1
- domain:
    match: httpdns.volcengine.com
    policy: DIRECT
    name: 字节 HTTPDNS 2
- domain_suffix:
    match: bdurl.net
    policy: DIRECT
    name: 字节 bdurl
- domain_suffix:
    match: qiyukf.com
    policy: DIRECT
    name: 七鱼客服 SDK
- domain_suffix:
    match: app-analytics-services.com
    policy: DIRECT
    name: Apple 系统统计
- domain_suffix:
    match: amdc.alipay.com
    policy: DIRECT
    name: 支付宝 HTTPDNS 调度
- domain_suffix:
    match: geo2.adobe.com
    policy: DIRECT
    name: Adobe 地区检测
- domain_suffix:
    match: dig.bdurl.net
    policy: DIRECT
    name: 百度 bdurl 回退
- domain_suffix:
    match: mssdk-bu.bytedance.com
    policy: DIRECT
    name: 字节设备风控
- domain_suffix:
    match: mob.com
    policy: DIRECT
    name: MobTech 分享（双用途，谨慎）
    disabled: true
- domain_suffix:
    match: getui.net
    policy: DIRECT
    name: 个推推送（双用途，谨慎）
    disabled: true
- domain_suffix:
    match: app-measurement.com
    policy: DIRECT
    name: Firebase Analytics
    disabled: true
- domain_suffix:
    match: iciba.com
    policy: DIRECT
    name: 金山词霸
    disabled: true
- domain_suffix:
    match: docer.com
    policy: DIRECT
    name: 道客巴巴
    disabled: true
- domain_suffix:
    match: ehaier.com
    policy: DIRECT
    name: 海尔
    disabled: true
- domain_suffix:
    match: kuaishouzt.com
    policy: DIRECT
    name: 快手政企
    disabled: true
- domain:
    match: ad.12306.cn
    policy: REJECT
    name: 12306 开屏广告（压住模块的 DIRECT）
