name: 微信外部链接解锁
description: 解锁微信外部链接访问限制，跳过中间界面。支付宝链接、被封禁链接进行通知弹窗跳转，在微信中用快照显示被封禁的链接（可选），在微信中进行强制重定向（可选），群聊及扫码均可使用，可选项可在脚本的2~3行更改，也可在BoxJs中更改。
author: zZPiglet[https://github.com/zZPiglet]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Weixin.png
open_url: https://apps.apple.com/app/id414478124
tag: 功能增强
scriptings:
- http_response:
    name: 微信外部链接解锁-响应
    match: (?i)^https\:\/\/(weixin110\.qq|security.wechat)\.com\/cgi-bin\/mmspamsupport-bin\/newredirectconfirmcgi\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/38d56dc721a3a3ae.js
mitm:
  hostnames:
  - weixin110.qq.com
  - security.wechat.com
