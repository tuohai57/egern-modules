# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/modules/kelee/kelee-美颜相机去广告-969a6872.lpx
# 源格式: lpx
name: 美颜相机去广告
description: 移除开屏广告、应用内弹窗，精简首页和我的页面。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/MeituMYXJ.png
open_url: https://apps.apple.com/app/id592331499
tag: 去广告
rules:
- domain:
    match: adui.tg.meitu.com
    policy: REJECT
url_rewrites:
- match: (?i)^https:\/\/api\.meiyan\.com\/operation\/home_banner\.json\?
  location: http://reject-dict/
- match: (?i)^https:\/\/api\.meiyan\.com\/vip\/permission_update_popup\.json\?
  location: http://reject-dict/
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.meiyan\.com\/operation\/get_config\.json\?
    filter: del(.response.time_limit, .response.bubble, .response.person_center)
- response_jq:
    match: (?i)^https:\/\/api\.meiyan\.com\/operation\/get_config\.json\?
    filter: .response.function_pop.meiyan_style.is_pop = false | .response.onoff.vip_half_window_exit_remain_popup.open = 0 | .response.onoff.vip_home_exit_remain_popup = 0
scriptings:
- http_response:
    name: 美颜相机去广告-响应
    match: (?i)^https:\/\/api\.meiyan\.com\/operation\/home\.json\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/55737ed59e633f56.js
mitm:
  hostnames:
  - api.meiyan.com
