# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/modules/kelee/kelee-叮咚买菜去广告-5622a746.lpx
# 源格式: lpx
name: 叮咚买菜去广告
description: 移除开屏广告、弹窗推广、搜索推荐、信息流广告、悬浮广告、各页面购物推荐、精简我的页面，移除底栏和各页面AI入口。
author: zirawell[https://github.com/zirawell], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], wish
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DingdongMaicai.png
open_url: https://apps.apple.com/app/id768082524
tag: 去广告
rules:
- domain:
    match: trackercollect.ddxq.mobi
    policy: REJECT
- domain:
    match: ddfs-public.ddimg.mobi
    policy: REJECT
- domain:
    match: rttrack.ddxq.mobi
    policy: REJECT
url_rewrites:
- match: (?i)^https?:\/\/119\.29\.29\.\d+\/d
  location: http://reject-200/
- match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/advert\/
  location: http://reject/
- match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/getHomeAdPop
  location: http://reject/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/vip\/getVipAd\/\?
  location: http://reject-dict/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/marketingNotice\?
  location: http://reject-dict/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/search\/rollHotKeyword\?
  location: http://reject-dict/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/search\/rankingList\?
  location: http://reject-dict/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/search\/hotKeyword\?
  location: http://reject-dict/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/order\/getRecommend$
  location: http://reject-dict/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/userLike\?
  location: http://reject-dict/
- match: (?i)^https:\/\/user\.api\.ddxq\.mobi\/userportal-service\/api\/v1\/user\/queryMyPage\/\?
  location: http://reject-dict/
- match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/guide-service\/userLike\/flowData$
  location: http://reject-dict/
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/categoriesNewDetail\?
    filter: del(.data.ad_info)
- response_jq:
    match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/tool\/getConfig\?
    filter: del(.data.ai_enter_config)
- response_jq:
    match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/newDetails\?
    filter: del(.data.top_advert_data, .data.suspension)
- response_jq:
    match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/newDetails\?
    filter: .data.list |= map(select(has(\"capsule_freedom_zone\") | not))
- response_jq:
    match: (?i)^https:\/\/maicai\.api\.ddxq\.mobi\/guide-service\/productApi\/productDetail\/info\?
    filter: del(.data.detail.chatEntry)
- response_jq:
    match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/bottomNavi
    filter: del(.data.adId?) | if (.data.bottom_list? | length > 0) then .data.bottom_list |= map(select(.type != \"eatwhat\")) else . end
- response_jq:
    match: (?i)^https?:\/\/maicai\.api\.ddxq\.mobi\/homeApi\/homeFlowDetail
    filter: walk(if type == \"object\" and has(\"list\") then .list |= map(if type == \"object\" and has(\"multi_advertise_data_list\") then del(.multi_advertise_data_list) else . end) else . end)
mitm:
  hostnames:
  - 119.29.29.*
  - maicai.api.ddxq.mobi
  - user.api.ddxq.mobi
