name: '📺 BiliBili: 🛡️ ADBlock'
description: 哔哩哔哩：去广告\n自定义去除APP内界面元素
author: ClydeTime[https://github.com/ClydeTime],VirgilClyne[https://github.com/VirgilClyne],app2smile[https://github.com/app2smile],RuCu6[https://github.com/RuCu6],Maasea[https://github.com/Maasea]
homepage: https://biliverse.github.io/guide/ad-block
icon: https://github.com/Biliverse/ADBlock/raw/main/src/assets/icon_rounded.png
open_url: http://boxjs.com/#/app/BiliBili.ADBlock
map_locals:
- match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/api\/ADBlock(?:\?.*)?$
  status_code: 200
  headers:
    '"Content-Type': application/json;
  body: '[{"id":"@Biliverse.ADBlock.Settings.Splash","name":"[开屏] 去除广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Feed.AD","name":"[推荐] 去除广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Feed.Activity","name":"[推荐] 去除“活动大图”","type":"boolean","val":false,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Feed.Vertical","name":"[推荐] 去除竖屏视频","type":"boolean","val":false,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Feed.BlockUpLiveList","name":"[推荐] 屏蔽UP主直播推广","type":"text","val":"","desc":"填写up主uid，以英文逗号隔开。"},{"id":"@Biliverse.ADBlock.Settings.Feed.Story","name":"[首页] 去除短视频流广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Feed.StoryCommercial","name":"[首页] 去除Story商业按钮","type":"boolean","val":true,"desc":"移除Story中的“助TA必火”等商业推广按钮，不删除视频卡片。"},{"id":"@Biliverse.ADBlock.Settings.Search.AD","name":"[搜索] 去除广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Search.Tracking","name":"[搜索] 移除响应跟踪参数","type":"boolean","val":false,"desc":"清理SearchAll结果对象及跳转链接中的trackid、report_flow_data，不修改播放签名和预加载数据。"},{"id":"@Biliverse.ADBlock.Settings.Search.HotSearch","name":"[搜索] 去除“热搜”","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.PGC.AD","name":"[番剧电影] 去除广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Xlive.AD","name":"[直播] 去除广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Xlive.RemoveTrackingCallbacks","name":"[直播] 移除推荐回调","type":"boolean","val":false,"desc":"移除直播推荐卡的show_callback与click_callback；可能影响推荐状态和翻页。"},{"id":"@Biliverse.ADBlock.Settings.Xlive.RemovePreloadTracking","name":"[直播] 移除预载链接trackid","type":"boolean","val":false,"desc":"只移除直播small_card_v1.subtitle_style.link中的trackid，保留播放、清晰度和会话参数。"},{"id":"@Biliverse.ADBlock.Settings.Dynamic.HotTopics","name":"[动态] 去除“热门话题”","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Dynamic.MostVisited","name":"[动态] 去除“最常访问”","type":"boolean","val":false,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Dynamic.MostVisitedLiveOnly","name":"[动态] “最常访问”仅显示直播","type":"boolean","val":false,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Dynamic.AdCard","name":"[动态] 去除广告卡片","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Dynamic.PersonalAdCard","name":"[动态] 去除个人流广告卡片","type":"boolean","val":false,"desc":"过滤DynAllPersonal与DynVideoPersonal中的cardType=15；当前抓包尚无广告阳性样本。"},{"id":"@Biliverse.ADBlock.Settings.View.AD","name":"[视频] 去除播放页广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.DM.Command","name":"[弹幕] 去除交互式弹幕","type":"boolean","val":false,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.DM.Colorful","name":"[弹幕] 替换彩色弹幕","type":"boolean","val":false,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.DM.Airborne","name":"[弹幕] 空降助手","type":"boolean","val":false,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Reply.AD","name":"[评论] 去除广告","type":"boolean","val":true,"desc":"是否启用此处修改"},{"id":"@Biliverse.ADBlock.Settings.Reply.CommercialLinks","name":"[评论] 禁用普通评论商业跳转","type":"boolean","val":false,"desc":"保留普通评论正文与回复树，仅移除已识别商品链接的可点击映射。"},{"id":"@Biliverse.ADBlock.Settings.Reply.SubjectDescriptionCommercial","name":"[评论] 隐藏编辑器商品能力","type":"boolean","val":false,"desc":"移除SubjectDescription中的商品与商业助手按钮(type 5/8)；当前抓包中它们均为隐藏状态。"},{"id":"@Biliverse.ADBlock.Settings.Privacy.Tracking","name":"[隐私] 移除响应链接跟踪参数","type":"boolean","val":true,"desc":"清理推荐、Story 与评论跳转链接中的高置信度归因参数，保留目标和界面功能参数。"},{"id":"@Biliverse.ADBlock.Settings.Privacy.BlockBiliCommercial","name":"[隐私] 阻止B站商业上报","type":"boolean","val":false,"desc":"本地成功响应conversion/mobile/v2与fees/wise，阻止相关请求上传。"},{"id":"@Biliverse.ADBlock.Settings.Privacy.BlockThirdParty","name":"[隐私] 阻止第三方广告归因","type":"boolean","val":false,"desc":"本地响应已确认的千问与Solar Engine广告展示、点击和归因请求。"},{"id":"@Biliverse.ADBlock.Settings.Privacy.Strict","name":"[隐私] 严格模式","type":"boolean","val":false,"desc":"同时启用响应跟踪清理、商业链接与上报阻断，并移除直播show/click callback；可能影响跳转、推荐和翻页。"},{"id":"@Biliverse.ADBlock.Settings.LogLevel","name":"[调试] 日志等级","type":"selects","val":"WARN","items":[{"key":"OFF","label":"🔴 关闭"},{"key":"ERROR","label":"❌ 错误"},{"key":"WARN","label":"⚠️ 警告"},{"key":"INFO","label":"ℹ️ 信息"},{"key":"DEBUG","label":"🅱️ 调试"},{"key":"ALL","label":"全部"}],"desc":"选择脚本日志的输出等级，低于所选等级的日志将全部输出。"}]'
- match: ^https?:\/\/(grpc\.biliapi\.net|app\.biliapi\.net|app\.bilibili\.com|app\.biliapi\.com)\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$
  status_code: 200
  headers:
    Content-Type: application/grpc
    Content-Length: '5'
    grpc-status: '0'
  body: ''
- match: ^https?:\/\/api\.vc\.bilibili\.com\/search_svr\/v\d\/Search\/recommend_words
  body: '{}'
- match: ^https?:\/\/api\.vc\.bilibili\.com\/topic_svr\/v1\/topic_svr
  body: '{}'
- match: ^https?:\/\/api\.vc\.bilibili\.com\/dynamic_svr\/v1\/dynamic_svr\/mix_uplist
  body: '{}'
- match: ^https?:\/\/manga\.bilibili\.com\/twirp\/comic\.v\d\.Comic\/Flash
  body: '{}'
- match: ^https?:\/\/manga\.bilibili\.com\/twirp\/comic\.v\d\.Comic\/ListFlash
  body: '{}'
- match: ^https?:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?
  body: '{}'
- match: ^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?
  headers:
    content-type: application/json
  body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
