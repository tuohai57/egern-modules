name: 百度网盘
description: 过滤百度网盘广告，解锁部分SVIP功能。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md], ddgksf2013[https://github.com/ddgksf2013], chxm1023[https://github.com/chxm1023]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/BaiduNetDisk.png
open_url: https://apps.apple.com/app/id547166701
tag: 去广告, 解锁会员
url_rewrites:
- match: (?i)^https:\/\/pan\.baidu\.com\/api\/getconfig\?
  location: http://reject-dict/
- match: (?i)^https:\/\/pan\.baidu\.com\/api\/getsyscfg\?
  location: http://reject-dict/
- match: (?i)^https:\/\/pan\.baidu\.com\/api\/taskscore\/tasklist\?
  location: http://reject-dict/
- match: (?i)^https:\/\/pan\.baidu\.com\/act\/api\/activityentry\?
  location: http://reject-dict/
- match: (?i)^https:\/\/pan\.baidu\.com\/rest\/\d\.\d\/pcs\/adv\?
  location: http://reject-dict/
- match: (?i)^https:\/\/pan\.baidu\.com\/api\/plugin\/get\?
  location: http://reject-dict/
- match: (?i)^https:\/\/pan\.baidu\.com\/recommend\/query\/list\?
  location: http://reject-dict/
- match: (?i)^https?:\/\/.*baidu\.com\/rest\/.*\/membership\/proxy\/guide
  location: http://reject-200/
- match: (?i)^https?:\/\/pan\.baidu\.com\/act\/v\d\/(bchannel|welfare)\/list
  location: http://reject-200/
- match: (?i)^https:\/\/pan\.baidu\.com\/feed\/hotlist
  location: http://reject-200/
- match: (?i)^https?:\/\/.*zhangyuyidong\.cn\/api\/zysdk
  location: http://reject-200/
- match: (?i)^https:\/\/pan\.baidu\.com\/queryintent\/queryhint
  location: http://reject-200/
- match: (?i)^https:\/\/pan\.baidu\.com\/coins\/center\/notice
  location: http://reject-200/
- match: (?i)^https:\/\/pan\.baidu\.com\/recommend\/shortseries\/list
  location: http://reject-dict/
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/pan\.baidu\.com\/feed\/kingkongdistrict\?
    filter: .data.data |= map(select(.type != \"novel\" and .type != \"shortplay\" and .type != \"print\" and .type != \"job_hunt\"))
scriptings:
- http_response:
    name: 百度网盘-响应
    match: (?i)^https?:\/\/afd\.baidu\.com\/afd\/entry
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/46280e3ca9ef0086.js
- http_response:
    name: 百度网盘-响应
    match: (?i)^https:\/\/pan\.baidu\.com\/feed\/cardinfos
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/46280e3ca9ef0086.js
- http_response:
    name: 百度网盘-响应
    match: (?i)^https:\/\/pan\.baidu\.com\/rest\/.*\/membership\/user\?method=gamecenter
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/46280e3ca9ef0086.js
- http_response:
    name: 百度网盘-响应
    match: (?i)^https?:\/\/pan\.baidu\.com\/(act\/.+\/(activityentry|bchannel|cardwelfare|skin)|rest\/.+\/(membership\/user|pcs\/adv)|feed\/cardinfos|api\/(user\/getinfo|quota|loginstatus|account\/getprivilege)|buy\/ad\/conf|wap\/vip|coins\/taskcenter\/homensr)
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/771d495ddc95a2f2.js
- http_request:
    name: 百度网盘-请求
    match: (?i)^https:\/\/pan\.baidu\.com\/api\/streaming\?app_id=\d+&type=M3U8_HQ_1080
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/22a409faf6c15508.js
- http_response:
    name: 百度网盘-响应
    match: (?i)^https:\/\/pan\.baidu\.com\/rest\/.*\/membership\/user
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/22a409faf6c15508.js
mitm:
  hostnames:
  - pan.baidu.com
  - afd.baidu.com
