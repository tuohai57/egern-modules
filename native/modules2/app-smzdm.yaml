# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/modules/loonlab/loonlab-plugin-cdbfbadb.lpx
# 源格式: lpx
name: 什么值得买
description: 过滤什么值得买广告
author: ZenmoFeiShi[https://github.com/ZenmoFeiShi], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/ZhiDeMai.png
open_url: https://apps.apple.com/app/id518213356
tag: 去广告
rules:
- domain:
    match: adx-api.zdmimg.com
    policy: REJECT
url_rewrites:
- match: (?i)^https:\/\/haojia\.m\.smzdm\.com\/detail_modul\/wiki_related_modul\?
  location: http://reject-dict/
- match: (?i)^https:\/\/s3\.zdmimg\.com\/third\/index\?
  location: http://reject-dict/
- match: (?i)^https:\/\/app-api\.smzdm\.com\/util\/loading\?
  location: http://reject-dict/
- match: (?i)^https:\/\/app-api\.smzdm\.com\/mychannel\/list$
  location: http://reject-dict/
- match: (?i)^https:\/\/h5\.smzdm\.com\/user\/coupon\/coupon_list\?
  location: http://reject/
- match: (?i)^https:\/\/user-api\.smzdm\.com\/vip\/bottom_card_list\?
  location: http://reject-dict/
- match: (?i)^https:\/\/article-api\.smzdm\.com\/publish\/get_bubble\?
  location: http://reject-dict/
- match: (?i)^https:\/\/s-api\.smzdm\.com\/sou\/search_default_keyword\?
  location: http://reject-dict/
- match: (?i)^https:\/\/s-api\.smzdm\.com\/sou\/popup_coupon\?
  location: http://reject-dict/
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/app-api\.smzdm\.com\/util\/update$
    filter: .data.silence_local_push = 0 | .data.baichuan_redirect_switch = 0
- response_jq:
    match: (?i)^https:\/\/app-api\.smzdm\.com\/util\/update$
    filter: del(.data.silence_local_push_msg, .data.video_cache_num_configs, .data.haojia_widget, .data.widget, .data.operation_float)
- response_jq:
    match: (?i)^https:\/\/app-api\.smzdm\.com\/util\/update$
    filter: 'def r: if type==\"object\" then if has(\"ad_campaign_name\") and (.ad_campaign_name|type==\"string\") and (.ad_campaign_name|test(\"\\S\")) then empty else . end elif type==\"array\" then map(r) else . end; .data.operation_float |= map(map(r))'
- response_jq:
    match: (?i)^https:\/\/homepage-api\.smzdm\.com\/v3\/home\?
    filter: jq-path=https://kelee.one/Resource/JQLang/smzdm/home_smzdm_remove_ads.jq
- response_jq:
    match: (?i)^https:\/\/haojia-api\.smzdm\.com\/home\/list\?
    filter: del(.data.header_operation.theme)
- response_jq:
    match: (?i)^https:\/\/haojia-api\.smzdm\.com\/home\/list\?
    filter: .data.rows |= map(select(.cell_type == \"39001\")) | .data.banner_v2 |= map(select(.cell_type == \"21028\"))
- response_jq:
    match: (?i)^https:\/\/haojia\.m\.smzdm\.com\/detail_modul\/user_related_modul\?
    filter: del(.data.super_coupon)
- response_jq:
    match: (?i)^https:\/\/haojia\.m\.smzdm\.com\/detail_modul\/other_modul\?
    filter: del(.data.banner)
- response_jq:
    match: (?i)^https:\/\/user-api\.smzdm\.com\/vip$
    filter: del(.data.activity_entrance_info, .data.big_banner, .data.top_banner, .data.banner_switch, .data.yaoqingshaiwu, .data.right_info)
- response_jq:
    match: (?i)^https:\/\/s-api\.smzdm\.com\/sou\/list_v10\?
    filter: .data.rows |= map(select(.model_type != \"ads\")) | .data.top_aladdin |= map(select(has(\"ad\") | not))
- response_jq:
    match: (?i)^https:\/\/s-api\.smzdm\.com\/sou\/filter\/tags\/hot_tags\?
    filter: del(.data.search_faxian, .data.tonglan, .data.hongbao)
- response_jq:
    match: (?i)^https:\/\/s-api\.smzdm\.com\/sou\/filter\/tags\/hot_tags\?
    filter: .data.hot_tab |= (if type == \"array\" then map(select(.search_method != \"热点主题榜\")) else . end) | if .data.hot_tab then .data.hot_tab |= map(if .search_method == \"热搜榜搜索热榜\" and .rows then .rows |= map(select(.pos != null and ((.pos | tonumber) != null))) else . end) else . end
- response_jq:
    match: (?i)^https:\/\/haojia-api\.smzdm\.com\/detail\/\d+\?
    filter: del(.data.quan_log)
- response_jq:
    match: (?i)^https:\/\/haojia-cdn\.smzdm\.com\/preload\/\d+\/fiphone\/v\d+_\d+_\d+\/wx\d+\/im\d+\/[0-9a-z]+\/[0-9a-z]+\.json$
    filter: del(.data.quan_log)
- response_jq:
    match: (?i)^https:\/\/post\.m\.smzdm\.com\/ajax_app\/ajax_get_footer_list\?
    filter: del(.data.tuiguang_ad, .data.activity_banner)
- response_jq:
    match: (?i)^https:\/\/qianbao\.smzdm\.com\/v\d\/app\/home
    filter: .data |= map(select(.id == \"40\" or .id == \"20\"))
mitm:
  hostnames:
  - app-api.smzdm.com
  - homepage-api.smzdm.com
  - h5.smzdm.com
  - haojia-api.smzdm.com
  - haojia.m.smzdm.com
  - user-api.smzdm.com
  - article-api.smzdm.com
  - s-api.smzdm.com
  - haojia-cdn.smzdm.com
  - post.m.smzdm.com
  - qianbao.smzdm.com
  - s3.zdmimg.com
