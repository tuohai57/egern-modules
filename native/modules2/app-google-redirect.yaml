# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/modules/kelee/kelee-Google搜索重定向-e61f5138.lpx
# 源格式: lpx
name: Google搜索重定向
description: 将Google搜索重定向至.com域名，如遇频繁跳转请禁用本插件。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://hub.kelee.one
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/Google.png
tag: 去广告
url_rewrites:
- match: (?i)^https?:\/\/(www.)?(g|google)\.cn
  location: https://www.google.com
  status_code: 307
- match: (?i)^https?:\/\/(ditu|maps).google\.cn
  location: https://maps.google.com
  status_code: 307
mitm:
  hostnames:
  - www.google.cn
