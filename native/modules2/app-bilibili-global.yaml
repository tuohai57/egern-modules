name: '📺 BiliBili: 🌐 Global'
description: 哔哩哔哩：全球模式\n中国站自动线路及全区搜索
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://biliverse.github.io/guide/global
icon: https://github.com/Biliverse/Global/raw/main/src/assets/icon_rounded.png
open_url: http://boxjs.com/#/app/BiliBili.Global
map_locals:
- match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/api\/Global(?:\?.*)?$
  status_code: 200
  headers:
    '"Content-Type': application/json;
  body: '[{"id":"@Biliverse.Global.Settings.ForceHost","name":"强制CDN主机名类型","type":"selects","val":"1","items":[{"key":"0","label":"IP: 返回远端DNS解析地址（强烈不推荐！严重影响域名分流规则与CDN重定向）"},{"key":"1","label":"HTTP: 返回HTTP域名（推荐，免去重定向时MitM操作）"},{"key":"2","label":"HTTPS: 返回HTTPS域名（不推荐，重定向时需对指定域名启用MitM）"}],"desc":"请设置强制返回的CDN主机名类型。"},{"id":"@Biliverse.Global.Settings.Locales","name":"启用自动识别与分流功能的地区","type":"checkboxes","val":["CHN","HKG","TWN"],"items":[{"key":"CHN","label":"🇨🇳中国大陆"},{"key":"HKG","label":"🇭🇰中国香港"},{"key":"MAC","label":"🇲🇴中国澳门"},{"key":"TWN","label":"🇹🇼中国台湾"}],"desc":"请选择启用自动识别与分流功能的地区。"},{"id":"@Biliverse.Global.Settings.Proxies.CHN","name":"[🇨🇳中国大陆] 代理策略名称","type":"text","val":"DIRECT","desc":"请填写此地区的代理或策略组名称。"},{"id":"@Biliverse.Global.Settings.Proxies.HKG","name":"[🇭🇰中国香港] 代理策略名称","type":"text","val":"🇭🇰香港","desc":"请填写此地区的代理或策略组名称。"},{"id":"@Biliverse.Global.Settings.Proxies.MAC","name":"[🇲🇴中国澳门] 代理策略名称","type":"text","val":"🇲🇴澳门","desc":"请填写此地区的代理或策略组名称。"},{"id":"@Biliverse.Global.Settings.Proxies.TWN","name":"[🇹🇼中国台湾] 代理策略名称","type":"text","val":"🇹🇼台湾","desc":"请填写此地区的代理或策略组名称。"},{"id":"@Biliverse.Global.Settings.LogLevel","name":"[调试] 日志等级","type":"selects","val":"WARN","items":[{"key":"OFF","label":"关闭"},{"key":"ERROR","label":"❌ 错误"},{"key":"WARN","label":"⚠️ 警告"},{"key":"INFO","label":"ℹ️ 信息"},{"key":"DEBUG","label":"🅱️ 调试"},{"key":"ALL","label":"全部"}],"desc":"选择脚本日志的输出等级，低于所选等级的日志将全部输出。"}]'
