body_rewrites:
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\?
    filter: del(.result.icon_set, .result.search_bar_hot_query, .result.dy_module.irregular_banner_dy)
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/alexa\/homepage\/hub\?
    filter: .result.bottom_tabs? |= map(select(.link | IN(\"index.html\",\"chat_list.html\",\"personal.html\"))) | .result.buffer_bottom_tabs? |= map(select(.link | IN(\"index.html\",\"chat_list.html\",\"personal.html\"))) | .result.all_top_opts = [] | .result.module_order? |= map(select(.module_name | IN(\"irregular_banner\",\"ad_module\",\"timeline\") | not))
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/search\?
    filter: del(.expansion)
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/philo\/personal\/hub\?
    filter: del(.monthly_card_entrance, .personal_center_style_v2_vo, .icon_set.icons, .icon_set.top_personal_icons, .title_bar_items, .personal_banner)
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/oak\/integration\/render\?
    filter: del(.bottom_section_list, .ui.bottom_section, .ui.live_section.float_info)
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/order\/
    filter: del(.marketing_banner_vo, .shipping.banner_above_recommend)
- response_jq:
    match: (?i)^https:\/\/api\.pinduoduo\.com\/api\/aristotle\/order_list_v4\?
    filter: .orders |= map(.order_buttons |= map(del(.order_growth_tip)))
