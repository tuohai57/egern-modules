name: 百度贴吧（脚本已镜像）
description: 过滤百度贴吧广告
author: app2smile[https://github.com/app2smile], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://github.com/tuohai57/egern-mirror/tree/main/curated/modules
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/BaiduTieba.png
open_url: https://apps.apple.com/app/id477927812
tag: 去广告
compat_arguments:
  per_filter_video_thread: 'true'
compat_arguments_desc: 'per_filter_video_thread: 可选 true/false'
rules:
- domain:
    match: 180.76.76.200
    policy: REJECT
- ip_cidr:
    match: 180.76.76.200/32
    policy: REJECT
    no_resolve: true
url_rewrites:
- match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/f\/forum\/getInterestClassList$
  location: http://reject-dict/
- match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/f\/search\/discover$
  location: http://reject-dict/
- match: (?i)^https?:\/\/tieba\.baidu\.com\/c\/f\/search\/discover$
  location: http://reject-dict/
- match: (?i)^https:\/\/tieba\.baidu\.com\/c\/f\/forum\/getForumAlbum$
  location: http://reject-dict/
- match: (?i)^http:\/\/c\.tieba\.baidu\.com\/c\/f\/forum\/hotforum$
  location: http://reject-dict/
body_rewrites:
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/s\/sync$
    filter: del(.activity_switch, .video_report_config, .advertisement_config, .next_start, .push_strategy_new, .live_activity_guide, .h5_pop_ups, .duxiaoman_url, .is_need_remind_live_rooms, .floating_icon, .ad_stlog_switch, .first_time_motivate, .windowStrategyList, .ad_adsense, .ad_config, .videoup_guide_pop, .ad_origin_config_switch, .needNewUserLead, .h5_pop_ups_config, .alaTabColor, .search_guide, .ad_sdk_priority, .low_version_pop_config, .ad_num_competition_frs, .live_new_user_guide_day, .screen_fill_data_result, .yy_live_tab, .ad_num_competition_personalize, .complete_apk_url, .user_activity, .homepage_guide, .bottom_bubble_config, .home_screen_ad, .afSearch_tab, .recent_client_info, .video_activity, .namoaixud_url, .yy_live_config, .user_growth_task_list, .cloud_control_data_info, .wl_config.pb_banner_funad_cache_strategy, .wl_config.pb_comment_asyncafd_cache_strategy, .wl_config.download_edge_float, .wl_config.download_pause_retain_dialog_conf, .wl_config.download_mobile_dialog_conf, .wl_config.download_fake_progress_config_a, .wl_config.download_fake_progress_config_b, .scheme_whitelist)
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/s\/sync$
    filter: .wl_config.home_ad_num = 0 | .wl_config.frs_ad_num = 0 | .wl_config.pb_comment_ad_num = 0 | .wl_config.index_bear_density = 0 | .wl_config.frs_bear_density = 0 | .wl_config.index_bear_first_floor_max = 999999999 | .wl_config.index_bear_first_floor_min = 999999999
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/s\/sync$
    filter: '.index_tab_info |= map(select(.tab_name == \"推荐\")) | .top_level_navi |= {\"推荐\": .[\"推荐\"], \"侧边栏\": .[\"侧边栏\"], \"关注\": .[\"关注\"]}'
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/u\/user\/profile$
    filter: del(.url_map, .user_agent_info, .bubble_info, .duxiaoman_entry, .uc_card, .finance_tab, .vip_banner, .ala_live_info, .recom_naws_list, .duxiaoman, .user.consume_info, .namoaixud_entry)
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/u\/user\/profile$
    filter: .user.shake_ad_switch.is_show = 0
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/u\/user\/profile$
    filter: .custom_grid |= map(select(.title != \"游戏大厅\" and .title != \"预约管理\" and .title != \"领话费\" and .title != \"短故事\")) | .zone_info |= map(.common_func |= (if .common_func_noraml then .common_func_noraml |= map(select(.name != \"创建智能体\")) else . end)) | .zone_info |= map(select(.type != \"commerce\" and .type != \"banner\" and .type != \"game\"))
- response_jq:
    match: (?i)^https?:\/\/tieba\.baidu\.com\/c\/f\/forum\/forumGuide$
    filter: del(.hot_search)
- response_jq:
    match: (?i)^https?:\/\/tieba\.baidu\.com\/c\/f\/frs\/frsBottom\?
    filter: del(.card_activity)
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/f\/frs\/frsBottom$
    filter: del(.card_activity)
- response_jq:
    match: (?i)^https?:\/\/tiebac\.baidu\.com\/c\/f\/sidebar\/home$
    filter: del(.game_center, .tools, .task_list, .vip_banner)
scriptings:
- http_response:
    name: 百度贴吧（脚本已镜像）-响应
    match: (?i)^https?:\/\/tieba(?:c)?\.baidu\.com\/c\/(f\/excellent\/personalized|f\/frs\/page|b\/ad\/adBid|f\/ad\/getFeedAd|f\/pb\/page|f\/frs\/generalTabList)\?cmd=\d+&format=protobuf
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@8fc1da21596f39e6e6c452c11c23741ce150ec99/native/scripts/7e5d5ec2ce819c85.js
mitm:
  hostnames:
  - tiebac.baidu.com
  - tieba.baidu.com
