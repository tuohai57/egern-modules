# 源格式: lpx
name: 豆瓣去广告
description: 移除开屏广告、各页面信息流广告、首页横幅、搜索填充词。此插件需要IPA签名方可使用，App Store用户请勿使用此插件，务必点击下方主页链接查看详细教程。
author: 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://getupnote.com/share/notes/zSn1ShBmzNYISKcTgjXE5oHMrNf2/34bf3aad-7872-497d-b239-198e27e8c84c
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/DouBan.png
open_url: https://apps.apple.com/app/id907002334
tag: 去广告
url_rewrites:
- match: (?i)^https:\/\/api\.douban\.com\/v\d\/app_ads\/splash
  location: http://reject-dict/
- match: (?i)^https:\/\/frodo\.douban\.com\/api\/v\d\/erebor\/feed_ad
  location: http://reject-dict/
- match: (?i)^https:\/\/m\.douban\.com\/rexxar\/api\/v\d\/market\/products\/
  location: http://reject-dict/
- match: (?i)^https:\/\/frodo\.douban\.com\/api\/v\d\/movie\/ad
  location: http://reject-dict/
- match: (?i)^https:\/\/frodo\.douban\.com\/api\/v\d\/home_banner
  location: http://reject-dict/
- match: (?i)^https:\/\/frodo\.douban\.com\/api\/v\d\/search\/found_words
  location: http://reject-dict/
mitm:
  hostnames:
  - api.douban.com
  - frodo.douban.com
  - m.douban.com
