# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://github.com/kokoryh/Sparkle/raw/refs/heads/master/release/surge/module/bilibili.sgmodule
# 源格式: sgmodule
name: 哔哩哔哩增强
description: 拜托，没有广告的哔哩哔哩真的超酷的
rules:
- domain:
    match: bsbsb.top
    policy: '{{{空降助手策略}}}'
- domain:
    match: dns.google
    policy: REJECT
- domain:
    match: api.biliapi.com
    policy: REJECT
- domain:
    match: app.biliapi.com
    policy: REJECT
- domain:
    match: api.biliapi.net
    policy: REJECT
- domain:
    match: app.biliapi.net
    policy: REJECT
- and:
    match:
    - domain_suffix:
        match: chat.bilibili.com
    - or:
        match:
        - domain_keyword:
            match: stun
        - domain_keyword:
            match: tracker
        - domain_keyword:
            match: p2p
    policy: pre-matching
- dest_port:
    match: '4480'
    policy: REJECT
- dest_port:
    match: '4483'
    policy: REJECT
- dest_port:
    match: '9102'
    policy: REJECT
map_locals:
- match: ^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list\?
  headers:
    content-type: application/json
  body: '{"code":0,"message":"OK","ttl":1,"data":{"max_time":0,"min_interval":31536000,"pull_interval":31536000,"keep_ids":[],"show":[],"list":[{}],"splash_request_id":""}}'
- match: ^https:\/\/ap[ip]\.bilibili\.com\/x\/(?:resource\/(?:top\/activity|patch\/tab(?:\/v2)?)|v2\/search\/square|vip\/ads\/materials)\?
  headers:
    content-type: application/json
  body: '{"code":-404,"message":"-404","ttl":1,"data":null}'
- match: ^https:\/\/api\.bilibili\.com\/pgc\/activity\/deliver\/material\/receive\?
  headers:
    content-type: application/json
  body: '{"code":0,"data":{"closeType":"close_win","container":[],"showTime":""},"message":"success"}'
- match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/e-commerce-interface\/v1\/ecommerce-user\/get_shopping_info\?
  headers:
    content-type: application/json
  body: '{}'
- match: ^https:\/\/line3-h5-mobile-api\.biligame\.com\/game\/live\/large_card_material\?
  headers:
    content-type: application/json
  body: '{"code":0,"message":"success"}'
- match: ^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.interface\.v1\.Teenagers\/ModeStatus$
  headers:
    content-type: application/grpc
    grpc-status: '0'
  body: AAAAABMKEQgCEgl0ZWVuYWdlcnMgAioA
- match: ^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.interface\.v1\.Search\/DefaultWords$
  headers:
    content-type: application/grpc
    grpc-status: '0'
  body: '"AAAAACEaHeaQnOe0ouinhumikeOAgeeVquWJp+'
- match: ^https:\/\/grpc\.biliapi\.net\/bilibili\.app\.(?:view\.v1\.View\/TFInfo|viewunite\.v1\.View\/(?:PlayPause|ViewEndPage))$
  headers:
    content-type: application/grpc
    grpc-status: '0'
  body: ''
scriptings:
- http_request:
    name: '{{{优化评论区加载}}}'
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.viewunite\.v1\.View\/View|main\.community\.reply\.v1\.Reply\/MainList)$
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/c727027b031d7aeb.js
    body_required: true
    binary_body: true
- http_request:
    name: '{{{空降助手}}}'
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:community\.service\.dm\.v1\.DM\/DmSegMobile|app\.view(?:unite)?\.v1\.View\/ViewProgress)$
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/c727027b031d7aeb.js
    body_required: true
    binary_body: true
- http_response:
    name: bilibili.skin
    match: ^https:\/\/app\.bilibili\.com\/x\/resource\/show\/skin\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/92bd7ca82d4c6ca7.js
    body_required: true
- http_response:
    name: bilibili.json
    match: ^https:\/\/app\.bilibili\.com\/x\/(?:resource\/show\/tab\/v2|v2\/(?:splash\/(?:show|event\/list2)|feed\/index(?:\/story)?|account\/(?:mine(?:\/ipad)?|myinfo)))\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/cc6e710a8025dad7.js
    body_required: true
- http_response:
    name: bilibili.live
    match: ^https:\/\/api\.live\.bilibili\.com\/xlive\/(?:app-interface\/v2\/index\/feed|app-room\/v1\/index\/getInfoBy(?:Room|User))\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/cc6e710a8025dad7.js
    body_required: true
- http_response:
    name: bilibili.webpage
    match: ^https:\/\/www\.bilibili\.com\/blackboard\/era\/[^?]+\.html\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/fd8c2088410049a2.js
    body_required: true
- http_response:
    name: bilibili.protobuf.response
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.(?:show\.v1\.Popular\/Index|dynamic\.v2\.Dynamic\/DynAll|view(?:unite)?\.v1\.View\/(?:View|ViewProgress|RelatesFeed|AIRelateAsync)|playurl\.v1\.PlayURL\/PlayView|playerunite\.v1\.Player\/PlayViewUnite)|polymer\.app\.search\.v1\.Search\/SearchAll|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|pgc\.gateway\.player\.v2\.PlayURL\/PlayView)$
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/46d4b9a682ed1d48.js
    body_required: true
    binary_body: true
mitm:
  hostnames:
  - grpc.biliapi.net
  - app.bilibili.com
  - api.bilibili.com
  - api.live.bilibili.com
  - www.bilibili.com
  - line3-h5-mobile-api.biligame.com
