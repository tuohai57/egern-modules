body_rewrites:
- response_jq:
    match: (?i)^https:\/\/m-cloud\.zhihu\.com\/api\/cloud\/zhihu\/config\/all\?
    filter: 'def drop_keys: {\"km_httpdns_new_config_tars\":true,\"preFetchHttpDns\":true,\"httpdns_detector_use_concurrent\":true,\"httpdns_use_memory_cache\":true,\"httpdns_new_config_tars\":true,\"coreNetworkConf_useTars\":true,\"km_coreNetworkConf_useTars\":true,\"sugarQuicConfig\":true,\"quic_dns_detect_enable\":true,\"quicMixAB\":true,\"quic_downgrade_enable\":true,\"quic_priority_strategy\":true,\"quic_check_health_enable\":true,\"tquic_configuration\":true,\"networkExprimentList\":true,\"tars_ab_list\":true,\"zaSetExtraRequestHeader\":true}; .data.configs |= map(select((drop_keys[.configKey] // false) | not) | if (.configValue | type) == \"object\" then del(.configValue.delayHttpdns, .configValue.dnsParser, .configValue.HTTPDNS) else . end)'
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/root\/tab\/v\d(?:\?.+)?$
    filter: .tab_list |= map(select(.tab_type == \"follow\" or .tab_type == \"recommend\" or .tab_type == \"hot\" or .tab_type == \"ring_tab\"))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/topstory\/recommend\?
    filter: .data |= map(select(.type == \"ComponentCard\"))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/questions\/\d+\/feeds\?
    filter: del(.ad_info)
- response_jq:
    match: (?i)^https:\/\/(api|page-info)(?:\.zhihu)?\.com\/answers\/v\d\/\d+(?:\?.*)?$
    filter: del(.third_business, .float_search_word)
- response_jq:
    match: (?i)^https:\/\/(api|page-info)(?:\.zhihu)?\.com\/answers\/v\d\/\d+(?:\?.*)?$
    filter: .structured_content.segments |= map(select(.type != \"card\"))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/topstory\/recommend\?
    filter: .data[]?.children |= (if type == \"array\" then map(select(.id != \"ring\")) else . end)
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/(articles|answers|pins)\/v\d\/\d+\?
    filter: del(.third_business, .ring_info, .interaction_bar_plugins)
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/podcasts\/hub\/v\d$
    filter: del(.banners)
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search_v\d\?
    filter: del(.pendant)
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/tabs\?
    filter: .data |= map(select(.t | IN(\"general\", \"ai_zhida\", \"recent\", \"people\", \"zvideo\", \"ring\", \"topic\", \"podcast\", \"column\", \"pin\", \"favlist\")))
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/people\/self$
    filter: del(.vip_info.entrance_new.right_button, .vip_info.entrance_v2)
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/bazaar\/vip_tab\/header\?
    filter: del(.activity_banner, .activity_window, .vip_tip)
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/comment_v5\/(answers|pins)\/\d+\/root_comment\?
    filter: del(.atmosphere_voting_config)
- response_jq:
    match: (?i)^https:\/\/api\.zhihu\.com\/questions\/\d+(?:\/answers|\/feeds|\?include=)
    filter: del(.ad_info, .data.ad_info?, .query_info) | if (.data | type) == \"array\" then .data |= map(select(.target?.answer_type? // \"\" | tostring | contains(\"paid\") | not)) else . end
- response_regex:
    match: (?i)^https:\/\/api\.zhihu\.com\/search\/recommend_query\/v2\?
    find: recommend_queries:\{.+\}
    replace: recommend_queries:{}
