icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/Amap.png
open_url: https://apps.apple.com/app/id461703208
tag: 去广告
rules:
- and:
    match:
    - url_regex:
        match: '"^http:\/\/.+\/amdc\/mobileDispatch"'
    - user_agent:
        match: '"AMapiPhone*"'
    policy: REJECT
- domain:
    match: amap-aos-info-nogw.amap.com
    policy: REJECT
- domain:
    match: free-aos-cdn-image.amap.com
    policy: REJECT
- domain_suffix:
    match: v.smtcdns.com
    policy: REJECT
