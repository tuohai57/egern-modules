body_rewrites:
- response_jq:
    match: (?i)^https:\/\/m5\.amap\.com\/ws\/shield\/search_business\/process\/marketingOperationStructured\?
    filter: del(.data.tipsOperationLocation, .obj.data.resourcePlacement)
- response_jq:
    match: (?i)^https:\/\/m5\.amap\.com\/ws\/shield\/search_poi\/homepage\?
    filter: del(.history_tags)
- response_jq:
    match: (?i)^https:\/\/m5-zb\.amap\.com\/ws\/sharedtrip\/taxi\/order_detail_car_tips\?
    filter: del(.data.carTips.data.popupInfo)
- response_jq:
    match: (?i)^https:\/\/m5\.amap\.com\/ws\/shield\/dsp\/profile\/index\/nodefaasv3\?
    filter: del(.data.tipData, .data.wallet) | .data.cardList |= map(select(.dataKey == \"MineNewFootprintCard\" or .dataKey == \"MineNewBEntranceCardV4\")) | (.data.cardList[] | select(.dataKey == \"MineNewBEntranceCardV4\") | .content.entranceList_1) |= map(select(.id == 7 or .id == 8 or .id == 10 or .id == 17)) | (.data.cardList[] | select(.dataKey == \"MineNewBEntranceCardV4\") | .content.entranceList_2) |= map(select(.id == 1 or .id == 32 or .id == 9 or .id == 14))
- response_jq:
    match: (?i)^https:\/\/sns\.amap\.com\/ws\/opc\/tools\/list\?
    filter: (if (type == \"object\") and ((.data | type) == \"object\") and ((.data.category | type) == \"array\") then (.data.category[] | select(type == \"object\") | .tools | select(type == \"array\") | .[] | select(type == \"object\")) |= del(.tips) else . end) | (if (type == \"object\") and ((.data | type) == \"object\") and ((.data.category | type) == \"array\") then (.data.category[] | select(type == \"object\") | .tools | select(type == \"array\")) |= map(select(if type == \"object\" then (((.id | type) == \"string\" and .id == \"547\") or ((.id | type) == \"number\" and .id == 547)) | not else true end)) else . end)
- response_jq:
    match: (?i)^https:\/\/info\.amap\.com\/ws\/c3frontend\/af-search\/search\?
    filter: if (try (.data.modules.quickLink.data.list | type) catch null) == \"array\" then .data.modules.quickLink.data.list |= map(if type == \"object\" and (.badge | type) == \"object\" and (.badge | has(\"text\")) then .badge.text = \"\" else . end) else . end
- response_jq:
    match: (?i)^https:\/\/m5-zb\.amap\.com\/ws\/amap\/hitch\/passenger\/content_info\?
    filter: del(.data.lubanData.banner)
- response_jq:
    match: (?i)^https:\/\/center\.amap\.com\/ws\/amc\/server\/conv\/raise_list\?
    filter: 'def on_path($p; $t; f): if (try (getpath($p) | type == $t) catch false) then getpath($p) |= f else . end; on_path([\"data\",\"dataList\"]; \"array\"; map(select(if type == \"object\" then (has(\"categoryId\") or ((.data | type) == \"object\" and .data.id == \"M_100007\")) else false end)))'
- response_jq:
    match: (?i)^https:\/\/info\.amap\.com\/ws\/shield\/search_business\/process\/middleLayer\/sug\?
    filter: .tip_list |= map(select(.tip.task_tag == \"common_content_general\" or .tip.task_tag == \"sp\"))
- response_jq:
    match: (?i)^https:\/\/m5\.amap\.com\/ws\/smartui\/near_recommend\?
    filter: del(.data.operation_activity)
