# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://github.com/tuohai57/egern-mirror/blob/main/modules/fmz200/partE/Eleme.sgmodule
# 源格式: sgmodule
name: 饿了么
description: 某些APP要清除缓存或者重新安装拦截广告才会生效！
author: 奶思
homepage: https://github.com/fmz200/wool_scripts
rules:
- domain_suffix:
    match: app-monitor.ele.me
    policy: REJECT
- domain_suffix:
    match: client-api.ele.me
    policy: REJECT
- domain_suffix:
    match: grand.ele.me
    policy: REJECT
- domain_suffix:
    match: mobile-pubt.ele.me
    policy: REJECT
- domain_suffix:
    match: newton-api.ele.me
    policy: REJECT
url_rewrites:
- match: ^https?:\/\/elemecdn\.com\/.+\/sitemap
  location: '-'
  status_code: 307
- match: ^https?:\/\/fuss10\.elemecdn\.com\/.+\/w\/640\/h\/\d{3,4}
  location: '-'
  status_code: 307
- match: ^https?:\/\/fuss10\.elemecdn\.com\/.+\/w\/750\/h\/\d{3,4}
  location: '-'
  status_code: 307
- match: ^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_1\d{3},h_2\d{3}\/format,webp\/
  location: '-'
  status_code: 307
- match: ^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_6\d{2},h_8\d{2}\/format,webp\/
  location: '-'
  status_code: 307
- match: ^https?:\/\/cube\.elemecdn\.com\/[\w\/]+\.jpeg\?x-oss-process=image\/resize,m_fill,w_\d{3},h_\d{4}\/format,webp\/
  location: '-'
  status_code: 307
- match: ^https?:\/\/cube\.elemecdn\.com\/\w\/\w{2}\/\w+mp4\.mp4\?
  location: '-'
  status_code: 307
- match: ^https?:\/\/www1\.elecfans\.com\/www\/delivery\/
  location: '-'
  status_code: 307
- match: ^https?:\/\/(nr-op|cube)\.elemecdn\.com\/.+\.jpeg\?x-oss-process=image\/resize,m_fill,w_\d{4,},h_\d{4,}\/($|format,webp\/$)
  location: '-'
  status_code: 307
map_locals:
- match: ^https?:\/\/fuss10\.elemecdn\.com\/.+?\.mp4
  status_code: 200
  body: ''
mitm:
  hostnames:
  - elemecdn.com
  - fuss10.elemecdn.com
  - cube.elemecdn.com
  - www1.elecfans.com
  - nr-op.elemecdn.com
