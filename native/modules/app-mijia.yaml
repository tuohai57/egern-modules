# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://github.com/tuohai57/egern-mirror/blob/main/modules/fmz200/partM/Mijia.sgmodule
# 源格式: sgmodule
name: 米家
description: 某些APP要清除缓存或者重新安装拦截广告才会生效！
author: 奶思
homepage: https://github.com/fmz200/wool_scripts
rules:
- domain:
    match: sdkconfig.ad.xiaomi.com
    policy: REJECT
map_locals:
- match: ^https?:\/\/home\.mi\.com\/cgi-op\/api\/v1\/recommendation\/(banner|carousel\/banners|myTab|openingBanner)
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https?:\/\/home\.mi\.com\/cgi-op\/api\/v1\/resource\/realtime\/openingBanner
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
mitm:
  hostnames:
  - home.mi.com
