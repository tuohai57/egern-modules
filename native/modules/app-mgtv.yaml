url_rewrites:
- match: ^https?:\/\/[\d\.]+:\d{5}\/\?cmd=indexes
  location: '-'
  status_code: 307
map_locals:
- match: ^https?:\/\/[\d\.]+\/odin\/c1\/(channel\/ads|skin\/config)\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https?:\/\/damang\.api\.mgtv\.com\/station\/album\/red\/dot\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https?:\/\/hb-boom\.api\.mgtv\.com\/release\/pullReleaseInfo
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https?:\/\/mobile\.api\.mgtv\.com\/v2\/mobile\/checkUpdate\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
- match: ^https?:\/\/mobileso\.bz\.mgtv\.com\/spotlight\/search\/v1\?
  status_code: 200
  headers:
    Content-Type: application/json
  body: '{}'
scriptings:
- http_response:
    name: 芒果TV我的页面
    match: ^https?:\/\/me\.bz\.mgtv\.com\/v3\/module\/list\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/5bb26e5f9cb4fada.js
    body_required: true
- http_response:
    name: 芒果TV首页信息流,顶部tab
    match: ^https?:\/\/mob-st\.bz\.mgtv\.com\/odin\/c1\/channel\/index\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/5bb26e5f9cb4fada.js
    body_required: true
- http_response:
    name: 芒果TV
    match: ^https?:\/\/dc2?\.bz\.mgtv\.com\/dynamic\/v1\/channel\/(index|vrsList)\/\w
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/5bb26e5f9cb4fada.js
    body_required: true
- http_response:
    name: 芒果TV底部tab
    match: ^https?:\/\/mobile\.api\.mgtv\.com\/mobile\/config\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/5bb26e5f9cb4fada.js
    body_required: true
- http_response:
    name: 芒果TV播放详情页
    match: ^https?:\/\/mobile\.api\.mgtv\.com\/v10\/video\/info\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/5bb26e5f9cb4fada.js
    body_required: true
- http_response:
    name: 芒果TV播放详情页
    match: ^https?:\/\/mobile-thor\.api\.mgtv\.com\/v1\/vod\/info\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/5bb26e5f9cb4fada.js
    body_required: true
- http_response:
    name: 芒果TV搜索框填充词
    match: ^https?:\/\/mobileso\.bz\.mgtv\.com\/mobile\/recommend\/v2\?
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/5bb26e5f9cb4fada.js
    body_required: true
mitm:
  hostnames:
  - '*.mgtv.com'
