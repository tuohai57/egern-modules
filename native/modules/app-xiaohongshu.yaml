# Egern 原生模块 · 由 Loon/Surge 格式转换
# 源: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/modules/loonlab/loonlab-plugin-79651793.lpx
# 源格式: lpx
name: 小红书
description: 过滤小红书广告，去除水印
author: RuCu6[https://github.com/RuCu6], fmz200[https://github.com/fmz200], meichiny[https://github.com/meichiny], 可莉🅥[https://github.com/luestr/ProxyResource/blob/main/README.md]
homepage: https://loonlab.103516.xyz/Plugin/
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/App/RedNote.png
open_url: https://apps.apple.com/app/id741292507
tag: 去广告
compat_arguments:
  rednote-feedtime: 'false'
compat_arguments_desc: 'rednote-feedtime: 首页笔记标题前显示时间'
rules:
- domain:
    match: ads-img-al.xhscdn.com
    policy: REJECT
- domain:
    match: ads-img-qc.xhscdn.com
    policy: REJECT
- domain:
    match: ads-video-al.xhscdn.com
    policy: REJECT
- domain:
    match: ads-video-qc.xhscdn.com
    policy: REJECT
- domain:
    match: t-ads.xiaohongshu.com
    policy: REJECT
- and:
    match:
    - protocol:
        match: QUIC
    - or:
        match:
        - domain_suffix:
            match: xiaohongshu.com
        - domain_suffix:
            match: rnote.com
    policy: REJECT
url_rewrites:
- match: (?i)^https?:\/\/ci\.(?:xiaohongshu|rnote)\.com\/system_config\/watermark
  location: http://reject-img/
- match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/surprisebox\/(?:get_style|open|submit_action)
  location: http://reject-dict/
- match: (?i)^https:\/\/www\.(?:xiaohongshu|rnote)\.com\/api\/marketing\/box\/trigger\?
  location: http://reject-dict/
- match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/(?:guide\/user_banner|note\/guide)
  location: http://reject-dict/
- match: (?i)^https:\/\/www\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v\d+\/(?:ads\/resource|hey\/\w+\/hey_gallery)
  location: http://reject-dict/
body_rewrites:
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/search\/banner_list$
    filter: .data = {}
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/search\/hot_list$
    filter: .data.items = []
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v4\/search\/hint
    filter: .data.hint_words = []
- response_jq:
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v4\/search\/trending\?
    filter: .data.queries = [] | .data.hint_word = {}
scriptings:
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/system\/service\/ui\/config\?
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/system_service\/config\?
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v2\/system_service\/splash_config
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v2\/(?:note\/widgets|user\/followings\/followfeed)
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v5\/recommend\/user\/follow_recommend\?
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/(?:edith|rec|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v6\/homefeed\?
    script_url: https://loon.103516.xyz/Script/RedNote/RedNote.feedtime.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/(?:edith|rec|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v4\/followfeed\?
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/(?:edith|rec|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v6\/homefeed\?
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/(?:edith|so)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v10\/search\/notes\?
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/(?:edith|rec|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/v1\/note\/(?:imagefeed|live_photo\/save)
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/(?:edith|rec|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/(?:v2\/note\/feed|v3\/note\/videofeed)
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/(?:edith|rec|www)\.(?:xiaohongshu|rnote)\.com\/api\/sns\/(?:v4\/note\/videofeed|v10\/note\/video\/save)
    script_url: https://rucu6.pages.dev/Scripts/xiaohongshu.js
- http_response:
    name: 小红书-响应
    match: (?i)^https:\/\/edith\.(?:xiaohongshu|rnote)\.com\/api\/sns\/(?:v1\/interaction\/comment\/video\/download|v5\/note\/comment\/list|v3\/note\/comment\/sub_comments)
    script_url: https://cdn.jsdelivr.net/gh/tuohai57/egern-modules@main/native/scripts/6d50baad22df9b29.js
mitm:
  hostnames:
  - ci.xiaohongshu.com
  - edith.xiaohongshu.com
  - rec.xiaohongshu.com
  - www.xiaohongshu.com
  - so.xiaohongshu.com
  - ci.rnote.com
  - edith.rnote.com
  - rec.rnote.com
  - www.rnote.com
  - so.rnote.com
