body_rewrites:
- response_jq:
    match: (?i)^https:\/\/conf\.diditaxi\.com\.cn\/homepage\/v1\/core\?
    filter: .data.disorder_cards.bottom_nav_list.data |= map(select(.id == \"home_page\" or .id == \"user_center\" or .id == \"message_center\" or .id == \"itinerary\")) | .data.order_cards.nav_list_card.data |= map(select(.nav_id == \"dache_anycar\" or .nav_id == \"carmate\" or .nav_id == \"driverservice\" or .nav_id == \"bike\" or .nav_id == \"nav_more_v3\"))
- response_jq:
    match: (?i)^https:\/\/conf\.diditaxi\.com\.cn\/homepage\/v1\/other\/fast\?
    filter: del(.data.disorder_cards.communicate_card, .data.disorder_cards.not_login_bottom_bar, .data.disorder_cards.riding_code_card, .data.disorder_cards.guess_card, .data.disorder_cards.scene_list_card, .data.order_cards, .data.disorder_cards.car_icon.data.icon_info_new_agreement)
- response_jq:
    match: (?i)^https:\/\/res\.xiaojukeji\.com\/resapi\/activity\/mget\?
    filter: del(.data.mult_home_banner)
- response_jq:
    match: (?i)^https:\/\/common\.diditaxi\.com\.cn\/common\/v5\/usercenter\/layout$
    filter: .data.instances |= with_entries(select(.key==\"center_base_info_card\" or .key==\"center_wallet_finance_card\" or .key==\"center_order_related_card\" or .key==\"center_tool_card\")) | (.data.instances.center_tool_card?.data?[0]?.data |= map(select(.content_data.nav_id | IN(\"chengweisiji\",\"chuxingchengjiu\",\"chongzhizhongxin\",\"shoucangjia\",\"ditufankui\")))) | (.data.instances.center_wallet_finance_card?.data.view_info |= map(select(.title==\"优惠卡券\")))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v1\/dache_homepage_layout\?
    filter: .data |= (.instances |= (to_entries | map(select(.key | test(\"feed_back_|dache_main_member|order_container_|dache_main_core_icon|dache_main_card_\"))) | from_entries))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v1\/pSFCHomePage\?
    filter: .data |= (if . == null then null else {hot_route_info, legal_info} end) | . as $root | .data.tab_list = ($root.data.tab_list | map(select(.tab_id == \"passenger\")))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/passenger-center\/v2\/other\/pInTripLayout
    filter: .data.order_components |= map(select((.name != \"passenger_common_casper\") and (.name != \"xp-card\")))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/passenger-center\/v2\/bronze\/pEndTripPaidLayout
    filter: .data.layout.order |= [\"finish-order-01\"] | del(.\"data\".\"layout\".\"disorder\".\"member-growth\")
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/passenger-center\/v2\/bronze\/pInTripLayout
    filter: .data.layout.order |= [\"header-card-1\", \"driver-card-1\"]
- response_jq:
    match: (?i)^https:\/\/daijia\.kuaidadi\.com:443\/gateway\?
    filter: del(.data.variantInfo)
- response_jq:
    match: (?i)^https:\/\/daijia\.kuaidadi\.com:443\/gateway\?
    filter: .data |= with_entries(select(.value.isAd != 1))
- response_jq:
    match: (?i)^https:\/\/common\.diditaxi\.com\.cn\/common\/v\d\/usercenter\/me
    filter: .data.cards |= (map(select(.title != \"天天领福利\" and .title != \"金融服务\" and .title != \"更多服务\" and .title != \"企业服务\" and .title != \"安全中心\")) | map(if .tag == \"wallet\" then (.items |= map(select(.title == \"优惠券\"))) | (if .card_type == 4 then .bottom_items |= map(select(.title == \"省钱套餐\" or .title == \"出行里程\")) else . end) else . end))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/pre-sale\/v1\/other\/pGetSceneList
    filter: .data.scene_list |= map(select(.text != \"优惠商城\")) | .data.show_data |= map(.scene_ids |= map(select(. != \"scene_coupon_mall\")))
- response_jq:
    match: (?i)^https:\/\/conf\.diditaxi\.com\.cn\/homepage\/v1\/oversea\/layout
    filter: del(.data.instances.oversea_main_banner)
- response_jq:
    match: (?i)^https:\/\/mapi\.xiaojukeji\.com\/passenger-wallet\/api\/v[\d.]+\/wallet\/homepage
    filter: .data.cardList |= (map(if .mcode == \"index_assets_v6\" then .detailData |= (del(.myCreditLimit) | .discountList |= .[:3] | del(.noticeList)) else . end) | map(select(.mcode == \"index_assets_v6\")))
- response_jq:
    match: (?i)^https:\/\/manhattan\.webapp\.xiaojukeji\.com\/zootopia\/api\/my-assets\/get-assets-data
    filter: del(.data.myQuotaModularRes, .data.assetsData.myQuotaModularRes, .data.banner, .data.assetsData.banner, .data.myGuaranteeModularRes, .data.assetsData.myGuaranteeModularRes)
- response_jq:
    match: (?i)^https:\/\/manhattan\.webapp\.xiaojukeji\.com\/zootopia\/api\/my-assets\/module-is-show
    filter: .data = []
- response_jq:
    match: (?i)^https:\/\/ddpay\.xiaojukeji\.com\/ddpay\/api\/manhattan-small-change\/get-all-config
    filter: .data.result = []
- response_jq:
    match: (?i)^https:\/\/ddpay\.xiaojukeji\.com\/ddpay\/api\/manhattan-small-change\/get-apollo-config
    filter: .data.result.hideList = []
- response_jq:
    match: (?i)^https:\/\/common\.diditaxi\.com\.cn\/passenger\/historyV2
    filter: .data.orders |= map(del(.guide_bar))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/intercity\/ticket\/api\/v1\/core\/getFullPageInfoLayout\?
    filter: .data.disorder_components |= (map(select(.name == \"history_order_card\" or .name == \"inprogress_order_card\" or .name == \"station_calendar\" or .name == \"main_card_v2\" or .name == \"user_history_order\")))
- response_jq:
    match: (?i)^https:\/\/htwkop\.xiaojukeji\.com:443\/gateway\?
    filter: del(.data.didi-bike-homepage-popup, .data.variantInfo)
- response_jq:
    match: (?i)^https:\/\/as\.xiaojukeji\.com\/ep\/as\/toggles\?
    filter: .data |= map(if .name|IN(\"daijia_journey_new_tcp_switch\",\"daijia_tcp_init\",\"daijia_tcp_msg_encrypt\",\"daijia_tcp_site_info\",\"daijia_tcp_site_report\")then.allow=false else. end)
- response_jq:
    match: (?i)^https:\/\/daijia\.kuaidadi\.com(:443)?\/gateway\?api=lj\.cos\.apolloConfig
    filter: .data |= map(select(.name != \"daijia-memberInfo-config\" and .name != \"daijia-transfer-share-config\"))
- response_jq:
    match: (?i)^https:\/\/daijia\.kuaidadi\.com(:443)?\/gateway\?api=lj\.cos\.apolloToggle
    filter: .data |= map(select(.name as $n | {daijia_app_estimate_pre_req_switch:true,daijia_agent_car_picture_check:true,daijia_bluetooth_wifi_degrade_switch:true,daijia_weixin_publish_login:true,daijia_estimate_recommend_degrade_switch:true,daijia_yugu_policy_switch:true,daijia_home_location_guide_switch:true,daijia_estimate_switch:true} | has($n)))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v\d\/bronze\/pinchengle_homepage_layout$
    filter: .data.instances |= with_entries(select(.key | IN(\"dacheanycar-certificates-1\", \"main-card-1\", \"map-1\", \"nav-1\", \"tool-container-1\")))
- response_jq:
    match: (?i)^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v\d\/SFCHomeTab\?
    filter: .data.tab_list |= map(select(.tab_id == \"passenger\" or .tab_id == \"driver\"))
- response_jq:
    match: (?i)^https:\/\/poi\.map\.xiaojukeji\.com\/mapapi\/startinfo\?api_version
    filter: del(.rec_destination)
- response_jq:
    match: (?i)^https:\/\/poi\.map\.xiaojukeji\.com\/mapapi\/poiinfo\?product_id
    filter: del(.rec_destination)
- response_jq:
    match: (?i)^https:\/\/common\.diditaxi\.com\.cn\/user_common\/itineraryList\?
    filter: del(.data.tab_nav[]?.tab_param)
